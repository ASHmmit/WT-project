<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AutoTrack Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginPage" class="center">
  <h1>🚗 AutoTrack</h1>
  <p>Click to enter</p>
  <button onclick="login()">Enter App</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">

<nav>
  <h2>🚗 AutoTrack</h2>
  <div>
    <button onclick="showSection('dashboard')" class="active">Dashboard</button>
    <button onclick="showSection('vehicles')">Vehicles</button>
    <button onclick="showSection('services')">Services</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="cards">
    <div class="card"><h3 id="statV">0</h3><p>Vehicles</p></div>
    <div class="card"><h3 id="statS">0</h3><p>Services</p></div>
    <div class="card"><h3 id="statC">₹0</h3><p>Total Cost</p></div>
  </div>

  <h3>Recent Services</h3>
  <ul id="recentList"></ul>
</div>

<!-- VEHICLES -->
<div id="vehicles" class="section">
  <h2>Vehicles</h2>
  <button onclick="openModal('vehicleModal')">+ Add</button>
  <div id="vehicleList" class="grid"></div>
</div>

<!-- SERVICES -->
<div id="services" class="section">
  <h2>Services</h2>
  <button onclick="openService()">+ Add</button>

  <table>
    <thead>
      <tr>
        <th>Vehicle</th><th>Type</th><th>Date</th><th>Cost</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="serviceTable"></tbody>
  </table>
</div>

</div>
</div>

<!-- VEHICLE MODAL -->
<div class="modal" id="vehicleModal">
  <div class="box">
    <h3>Add Vehicle</h3>
    <input id="vName" placeholder="Name">
    <input id="vPlate" placeholder="Plate">
    <input id="vReg" placeholder="Registration No">
    <input type="date" id="vPUC">
    <input type="date" id="vInsurance">
    <input id="vOdo" placeholder="Odometer">
    <button onclick="saveVehicle()">Save</button>
    <button onclick="closeModal('vehicleModal')">Cancel</button>
  </div>
</div>

<!-- SERVICE MODAL -->
<div class="modal" id="serviceModal">
  <div class="box">
    <h3>Add Service</h3>
    <select id="sVehicle"></select>
    <input id="sType" placeholder="Type">
    <input type="date" id="sDate">
    <input id="sCost" placeholder="Cost">
    <button onclick="saveService()">Save</button>
    <button onclick="closeModal('serviceModal')">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
